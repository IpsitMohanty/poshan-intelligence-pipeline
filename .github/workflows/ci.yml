name: CI - Poshan Intelligence

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 mypy pytest httpx

      - name: Lint (flake8)
        run: flake8 .

      # Black formatting check disabled temporarily
      # Uncomment later when you want strict formatting
      # - name: Format Check (black)
      #   run: black --check .

      - name: Type Check (mypy)
        run: mypy --ignore-missing-imports --exclude "main.py" .

      - name: Generate synthetic data
        # data/2025-11 (and everything derived from it) is real-data-shaped
        # but gitignored - real data is never committed, so a clean
        # checkout has no data/ at all. Regenerating from the seeded
        # generator here, in a clean environment, on every run, is also
        # the byte-reproducibility proof: if this seed ever stopped
        # producing identical output, CI would be the first to know.
        run: python scripts/generate_synthetic_data.py --seed 42

      - name: Build warehouse (ETL + cube)
        # warehouse/ is gitignored too - tests/test_pipeline_reconciliation.py
        # checks the synthetic data/2025-11 above against a warehouse built
        # from it, same as it always checked the real data against the real
        # warehouse.
        run: |
          python -m etl.run_month
          python -m cubes.run_cube

      - name: Run Tests
        run: pytest -v
        
      - name: Build ETL Docker Image
        run: docker build -f Dockerfile.etl -t poshan-etl .

      - name: Build Cube Docker Image
        run: docker build -f Dockerfile.cube -t poshan-cube .

      - name: Build API Docker Image
        run: docker build -f Dockerfile.api -t poshan-api .

  airflow-dag-integrity:
    runs-on: ubuntu-latest
    # Separate job, deliberately not a step in the `ci` job above:
    # apache-airflow's pinned constraints force typing-extensions down to
    # 4.12.2, which conflicts with pydantic/pydantic-core (a FastAPI
    # dependency) requiring >=4.14.1 - confirmed via `pip check` after
    # installing both apache-airflow and this project's requirements.txt
    # into one environment, not assumed compatible. Kept apart so
    # apache-airflow is never installed anywhere near the main job's
    # environment. See tests/test_airflow_dag.py's docstring and
    # README.md's Tests section for how the two jobs' counts are
    # reported (81 there, 11 here - not summed into one "N passed").
    #
    # This job never deploys the actual Airflow stack (no Postgres, no
    # webserver, no scheduler) - it only parses dags/poshan_pipeline_dag.py
    # and inspects the resulting DAG object, which is why it stays fast.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install apache-airflow (isolated - no project requirements.txt here)
        run: |
          python -m pip install --upgrade pip
          AIRFLOW_VERSION=2.10.5
          PYTHON_VERSION="3.11"
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}" pytest

      - name: DAG-integrity tests
        run: pytest tests/test_airflow_dag.py -v
